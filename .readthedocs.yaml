# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  apt_packages:
    # nbsphinx shells out to pandoc to convert the notebooks' markdown cells,
    # and the RTD image does not ship it.
    - pandoc

# The Sphinx tree lives in docs/sphinx/, not the template's docs/.
sphinx:
  configuration: docs/sphinx/conf.py
  fail_on_warning: false

# Install the package itself plus its docs extra: autodoc imports wcc_sim, so
# numpy/astropy/astroquery/synphot/photutils/dust_extinction have to be present.
# wcc_etc is not on PyPI and is not a declared dependency -- conf.py mocks it
# when it is missing, which is what happens here.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
