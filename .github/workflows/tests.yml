name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # wcc_etc is not on PyPI; the public repository ships the PSF data
          # the tests need (the raw FRED stray-light map is private; the
          # tests that rebuild the scatter profile from it skip).
          pip install "git+https://github.com/schmidt-observatories/wcc-etc.git"
          pip install -e ".[test]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q
